<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configuración de actas</title><link rel="stylesheet" href="/styles.css"></head>
<body class="scroll">
<header class="top"><a href="/">← Volver</a><strong>Configuración de actas</strong><span class="grow"></span></header>

  <div id="tipos" class="cfgtipos"></div>
